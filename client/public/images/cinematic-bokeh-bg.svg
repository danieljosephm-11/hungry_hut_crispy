<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0505" />
      <stop offset="35%" stop-color="#3a0806" />
      <stop offset="55%" stop-color="#1a0604" />
      <stop offset="100%" stop-color="#151312" />
    </linearGradient>
    <radialGradient id="centerDark" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#120303" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#1a0504" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hazeTop" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#E32619" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#FF6B00" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hazeEdgeL" cx="0%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#E32619" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hazeEdgeR" cx="100%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#FF6B00" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hazeBottom" cx="50%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#3a0a05" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#8B0000" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bokehWhite" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF1E5" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FFF1E5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFF1E5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokehGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFC247" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FF6B00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokehOrange" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#E32619" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E32619" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokehRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E32619" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#8B0000" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0" />
    </radialGradient>

    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="blurMed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="blurSharpGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="smoke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="28" />
    </filter>
    <filter id="smokeFine" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#hazeTop)" />
  <rect width="1920" height="1080" fill="url(#hazeEdgeL)" />
  <rect width="1920" height="1080" fill="url(#hazeEdgeR)" />
  <rect width="1920" height="1080" fill="url(#hazeBottom)" />

  <!-- Subtle cinematic smoke layers -->
  <g opacity="0.16" filter="url(#smoke)">
    <ellipse cx="350" cy="220" rx="420" ry="140" fill="#E32619" />
    <ellipse cx="1550" cy="260" rx="380" ry="130" fill="#FF6B00" />
    <ellipse cx="980" cy="820" rx="520" ry="160" fill="#8B0000" />
  </g>
  <g opacity="0.12" filter="url(#smokeFine)">
    <ellipse cx="200" cy="520" rx="360" ry="120" fill="#8B0000" />
    <ellipse cx="1700" cy="560" rx="340" ry="120" fill="#E32619" />
    <ellipse cx="960" cy="180" rx="460" ry="110" fill="#FF6B00" />
  </g>

  <!-- Large soft bokeh (upper & edges) -->
  <g filter="url(#blurSoft)">
    <circle cx="140" cy="120" r="150" fill="url(#bokehGold)" opacity="0.35" />
    <circle cx="420" cy="80" r="110" fill="url(#bokehOrange)" opacity="0.3" />
    <circle cx="1780" cy="140" r="170" fill="url(#bokehRed)" opacity="0.32" />
    <circle cx="1520" cy="70" r="120" fill="url(#bokehGold)" opacity="0.28" />
    <circle cx="80" cy="420" r="130" fill="url(#bokehRed)" opacity="0.26" />
    <circle cx="1840" cy="460" r="150" fill="url(#bokehOrange)" opacity="0.24" />
    <circle cx="260" cy="920" r="140" fill="url(#bokehOrange)" opacity="0.2" />
    <circle cx="1680" cy="940" r="160" fill="url(#bokehRed)" opacity="0.22" />
    <circle cx="960" cy="40" r="130" fill="url(#bokehGold)" opacity="0.18" />
  </g>

  <!-- Medium bokeh -->
  <g filter="url(#blurMed)">
    <circle cx="300" cy="180" r="70" fill="url(#bokehWhite)" opacity="0.22" />
    <circle cx="560" cy="140" r="55" fill="url(#bokehGold)" opacity="0.35" />
    <circle cx="780" cy="90" r="45" fill="url(#bokehOrange)" opacity="0.28" />
    <circle cx="1180" cy="110" r="60" fill="url(#bokehGold)" opacity="0.3" />
    <circle cx="1380" cy="170" r="75" fill="url(#bokehWhite)" opacity="0.18" />
    <circle cx="1620" cy="220" r="65" fill="url(#bokehOrange)" opacity="0.32" />
    <circle cx="120" cy="260" r="60" fill="url(#bokehGold)" opacity="0.3" />
    <circle cx="1820" cy="300" r="70" fill="url(#bokehWhite)" opacity="0.16" />
    <circle cx="60" cy="620" r="55" fill="url(#bokehOrange)" opacity="0.22" />
    <circle cx="1860" cy="650" r="60" fill="url(#bokehGold)" opacity="0.24" />
    <circle cx="220" cy="760" r="50" fill="url(#bokehRed)" opacity="0.24" />
    <circle cx="1710" cy="780" r="55" fill="url(#bokehOrange)" opacity="0.22" />
    <circle cx="520" cy="980" r="65" fill="url(#bokehGold)" opacity="0.18" />
    <circle cx="1420" cy="990" r="70" fill="url(#bokehRed)" opacity="0.18" />
    <circle cx="1040" cy="120" r="40" fill="url(#bokehWhite)" opacity="0.2" />
  </g>

  <!-- Small sparkling highlights -->
  <g filter="url(#blurSharpGlow)">
    <circle cx="210" cy="130" r="10" fill="#FFF1E5" opacity="0.55" />
    <circle cx="360" cy="210" r="8" fill="#FFC247" opacity="0.7" />
    <circle cx="470" cy="60" r="7" fill="#FFF1E5" opacity="0.5" />
    <circle cx="640" cy="170" r="9" fill="#FF6B00" opacity="0.6" />
    <circle cx="860" cy="60" r="6" fill="#FFF1E5" opacity="0.45" />
    <circle cx="1120" cy="150" r="8" fill="#FFC247" opacity="0.65" />
    <circle cx="1290" cy="70" r="7" fill="#FFF1E5" opacity="0.5" />
    <circle cx="1470" cy="130" r="10" fill="#FFC247" opacity="0.6" />
    <circle cx="1600" cy="90" r="6" fill="#FFF1E5" opacity="0.55" />
    <circle cx="1730" cy="210" r="9" fill="#FF6B00" opacity="0.55" />
    <circle cx="90" cy="320" r="7" fill="#FFC247" opacity="0.55" />
    <circle cx="1850" cy="360" r="8" fill="#FFF1E5" opacity="0.45" />
    <circle cx="150" cy="520" r="6" fill="#FF6B00" opacity="0.5" />
    <circle cx="1780" cy="540" r="7" fill="#FFC247" opacity="0.5" />
    <circle cx="70" cy="760" r="8" fill="#FFF1E5" opacity="0.4" />
    <circle cx="1845" cy="740" r="7" fill="#FF6B00" opacity="0.45" />
    <circle cx="320" cy="860" r="6" fill="#FFC247" opacity="0.45" />
    <circle cx="1600" cy="880" r="8" fill="#FFF1E5" opacity="0.4" />
    <circle cx="600" cy="40" r="6" fill="#FFF1E5" opacity="0.5" />
    <circle cx="1320" cy="40" r="7" fill="#FFC247" opacity="0.55" />
    <circle cx="980" cy="90" r="5" fill="#FFF1E5" opacity="0.45" />
    <circle cx="250" cy="980" r="6" fill="#FF6B00" opacity="0.4" />
    <circle cx="1700" cy="1000" r="6" fill="#FFC247" opacity="0.4" />
  </g>

  <!-- Floating golden-orange particles -->
  <g opacity="0.5">
    <circle cx="430" cy="260" r="3" fill="#FFC247" />
    <circle cx="520" cy="310" r="2.5" fill="#FF6B00" />
    <circle cx="690" cy="230" r="2" fill="#FFC247" />
    <circle cx="820" cy="280" r="3" fill="#FF6B00" />
    <circle cx="1080" cy="240" r="2.5" fill="#FFC247" />
    <circle cx="1210" cy="300" r="2" fill="#FF6B00" />
    <circle cx="1360" cy="260" r="3" fill="#FFC247" />
    <circle cx="1490" cy="320" r="2" fill="#FF6B00" />
    <circle cx="260" cy="360" r="2.5" fill="#FFC247" />
    <circle cx="1650" cy="350" r="2.5" fill="#FF6B00" />
    <circle cx="340" cy="700" r="2" fill="#FFC247" />
    <circle cx="1560" cy="720" r="2" fill="#FF6B00" />
    <circle cx="620" cy="820" r="2.5" fill="#FFC247" opacity="0.7" />
    <circle cx="1280" cy="840" r="2.5" fill="#FF6B00" opacity="0.7" />
  </g>

  <!-- Keep center calmer for content -->
  <rect width="1920" height="1080" fill="url(#centerDark)" />
  <ellipse cx="960" cy="560" rx="620" ry="340" fill="#151312" opacity="0.18" filter="url(#blurSoft)" />
</svg>
